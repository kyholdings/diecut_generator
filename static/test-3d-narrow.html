<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>diecut-3d narrow validation</title>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="/static/diecut-3d.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f5f5f5; }
    #preview-3d { width: 600px; height: 420px; border: 2px solid #333; border-radius: 8px; }
    .log { margin-top: 12px; padding: 8px; background: #fff; border-radius: 4px; font-size: 14px; }
    .pass { color: #16a34a; }
    .fail { color: #dc2626; }
  </style>
</head>
<body>
  <h2>diecut-3d.js 窄验证</h2>
  <div id="preview-3d"></div>
  <div id="log" class="log">初始化中...</div>

  <script>
    const log = document.getElementById('log');
    const results = [];

    function check(name, fn) {
      try {
        const ok = fn();
        results.push({ name, ok });
        log.innerHTML += `<div class="${ok ? 'pass' : 'fail'}">${ok ? '✓' : '✗'} ${name}</div>`;
      } catch (e) {
        results.push({ name, ok: false, error: e.message });
        log.innerHTML += `<div class="fail">✗ ${name}: ${e.message}</div>`;
      }
    }

    window.addEventListener('load', async () => {
      check('THREE 已加载', () => typeof THREE !== 'undefined');
      check('Diecut3D 已注册', () => typeof window.Diecut3D === 'object');
      check('Diecut3D.mount 存在', () => typeof window.Diecut3D.mount === 'function');
      check('Diecut3D.update 存在', () => typeof window.Diecut3D.update === 'function');
      check('Diecut3D.toggleFold 存在', () => typeof window.Diecut3D.toggleFold === 'function');
      check('Diecut3D.setProgress 存在', () => typeof window.Diecut3D.setProgress === 'function');
      check('Diecut3D.play 存在', () => typeof window.Diecut3D.play === 'function');

      const host = document.getElementById('preview-3d');
      check('宿主元素存在', () => host !== null);

      // 测试 mount
      window.Diecut3D.mount();
      check('mount 完成', () => host.querySelector('canvas') !== null);
      check('canvas 非空', () => {
        const c = host.querySelector('canvas');
        return c && c.width > 0 && c.height > 0;
      });

      // 测试 geometry API
      const geoResp = await fetch('/api/diecut/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ length: 200, width: 150, height: 60, thickness: 3 }),
      });
      const data = await geoResp.json();
      check('API 返回 ok', () => data.ok === true);
      check('geometry.dimensions 存在', () => data.geometry && data.geometry.dimensions);
      check('geometry.derived 存在', () => data.geometry && data.geometry.derived);
      check('geometry.segments 存在', () => Array.isArray(data.geometry.segments));
      check('segments 数量 > 0', () => data.geometry.segments.length > 0);

      // 测试 update
      window.Diecut3D.update(data.geometry);
      check('update 后 canvas 存在', () => host.querySelector('canvas') !== null);

      // 等折叠动画
      await new Promise(r => setTimeout(r, 1500));
      check('折叠动画后 canvas 存在', () => host.querySelector('canvas') !== null);

      // 汇总
      const passed = results.filter(r => r.ok).length;
      const total = results.length;
      log.innerHTML += `<hr><div><b>结果: ${passed}/${total} 通过</b></div>`;
    });
  </script>
</body>
</html>
